<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Resibulando</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png?v=resibulando2"
  >

  <link
    rel="stylesheet"
    href="style.css?v=12.3"
  >
  <link rel="stylesheet" href="resibulando-brand-v5.css?v=5">
  <script defer src="resibulando-brand-v5.js?v=5"></script>
</head>

<body class="loading-page">

  <div class="loading-card">

    <img
      class="loading-logo"
      src="logo-principal.png?v=resibulando2"
      alt="Logo Resibulando"
    >

    <strong>Resibulando</strong>

    <span>Carregando...</span>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    (async () => {
      const { data } =
        await window.supabaseClient.auth.getSession();

      window.location.replace(
        data.session
          ? "dashboard.html"
          : "login.html"
      );
    })();
  </script>

</body>
</html>
