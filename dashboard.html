<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DocMap | Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f6f8;

      color:
        #111827;
    }


    header {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 30px;

      background:
        white;

      border-bottom:
        1px solid #e5e7eb;
    }


    header h1 {
      margin: 0;

      font-size: 22px;
    }


    button {
      padding:
        10px 16px;

      border:
        none;

      border-radius:
        8px;

      background:
        #111827;

      color:
        white;

      font-weight:
        600;

      cursor:
        pointer;
    }


    main {
      width: 90%;

      max-width:
        1100px;

      margin:
        40px auto;
    }


    .card {
      padding:
        25px;

      background:
        white;

      border-radius:
        14px;

      box-shadow:
        0 6px 20px
        rgba(0,0,0,0.05);
    }


    #email-usuario {
      font-weight:
        600;
    }

  </style>

</head>


<body>

  <header>

    <h1>
      DocMap
    </h1>


    <button
      id="sair"
      type="button"
    >
      Sair
    </button>

  </header>


  <main>

    <div class="card">

      <h2>
        Dashboard
      </h2>


      <p>
        Usuário:
        <span id="email-usuario">
          carregando...
        </span>
      </p>


      <p id="status">
        Verificando sessão...
      </p>

    </div>

  </main>


  <script src="dashboard.js"></script>

</body>

</html>
