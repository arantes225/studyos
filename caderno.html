<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno · Resibulando</title>
  <link rel="icon" type="image/png" href="favicon.png?v=resibulando2">
  <link rel="stylesheet" href="style.css?v=12.1">
  <link rel="stylesheet" href="caderno.css?v=13.3">
  <link rel="stylesheet" href="resibulando-brand-v5.css?v=5">
  <script defer src="resibulando-brand-v5.js?v=5"></script>
</head>
<body data-page="caderno">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <main class="main notebook-main-shell">
      <div class="page notebook-page">

        <header class="topbar notebook-topbar">
          <button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button>

          <div class="page-heading">
            <span class="eyebrow" data-page-eyebrow></span>
            <h1 data-page-title></h1>
          </div>

          <div class="notebook-save-wrap">
            <span id="notebook-save-status" class="notebook-save-status">Selecione uma aula</span>
          </div>
        </header>

        <section class="notebook-workspace">

          <aside class="notebook-topic-panel">
            <div class="notebook-topic-head">
              <div>
                <span class="badge accent">Aulas</span>
                <h2>Tópicos</h2>
              </div>

              <span id="notebook-topic-count" class="notebook-topic-count">0</span>
            </div>

            <label class="notebook-search">
              <span class="sr-only">Pesquisar tópicos</span>
              <input
                id="notebook-topic-search"
                type="search"
                placeholder="Buscar aula, matéria ou área..."
                autocomplete="off"
              >
            </label>

            <div id="notebook-topic-list" class="notebook-topic-list">
              <div class="notebook-empty-small">Carregando tópicos...</div>
            </div>
          </aside>

          <section class="notebook-editor-column">

            <div id="notebook-toolbar" class="notebook-toolbar" aria-label="Ferramentas de edição">

              <select id="notebook-block-style" class="notebook-style-select" aria-label="Estilo do texto" disabled>
                <option value="p">Texto normal</option>
                <option value="h1">Título 1</option>
                <option value="h2">Título 2</option>
                <option value="h3">Subtítulo</option>
              </select>

              <span class="notebook-toolbar-divider"></span>

              <button
                id="notebook-bold"
                class="notebook-tool-button"
                type="button"
                title="Negrito"
                aria-label="Negrito"
                disabled
              >
                <strong>B</strong>
              </button>

              <div class="notebook-emoji-wrap">
                <button
                  id="notebook-emoji-toggle"
                  class="notebook-tool-button"
                  type="button"
                  title="Inserir emoji"
                  aria-label="Inserir emoji"
                  aria-expanded="false"
                  disabled
                >
                  ☺
                </button>

                <div id="notebook-emoji-menu" class="notebook-emoji-menu" hidden></div>
              </div>

              <button
                id="notebook-postit"
                class="notebook-tool-button notebook-postit-tool"
                type="button"
                title="Inserir post-it de alerta"
                aria-label="Inserir post-it de alerta"
                disabled
              >
                ▣
                <span>Post-it</span>
              </button>

              <span class="notebook-toolbar-spacer"></span>

              <button
                id="notebook-save-now"
                class="button secondary compact-button"
                type="button"
                disabled
              >
                Salvar
              </button>
            </div>

            <div id="notebook-empty-state" class="notebook-empty-state">
              <div class="notebook-empty-icon">✎</div>
              <strong>Escolha uma aula</strong>
              <p>
                O caderno é vinculado ao tema da aula. Se você abrir pela Ambientação,
                a aula atual já vem selecionada.
              </p>
            </div>

            <div id="notebook-document-wrap" class="notebook-document-wrap" hidden>
              <article class="notebook-paper">

                <header class="notebook-document-head">
                  <div id="notebook-document-breadcrumb" class="notebook-document-breadcrumb"></div>
                  <h1 id="notebook-document-title">Título da aula</h1>
                  <p id="notebook-document-meta"></p>
                </header>

                <div
                  id="notebook-editor"
                  class="notebook-editor"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  spellcheck="true"
                  data-placeholder="Comece suas anotações aqui..."
                ></div>

              </article>
            </div>

          </section>

        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=13.3"></script>
  <script src="caderno.js?v=13.3"></script>
</body>
</html>
