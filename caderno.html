<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Caderno · Resibulando</title>

  <link
    rel="icon"
    type="image/png"
    href="favicon.png?v=resibulando2"
  >

  <link
    rel="stylesheet"
    href="style.css?v=12.1"
  >

  <link
    rel="stylesheet"
    href="caderno.css?v=14.0"
  >
</head>

<body data-page="caderno">

  <div class="app-shell">

    <aside
      id="sidebar"
      class="sidebar"
    ></aside>

    <div
      id="sidebar-backdrop"
      class="sidebar-backdrop"
    ></div>

    <main class="main notebook-main-shell">

      <div class="page notebook-page">

        <!-- TOPO -->
        <header class="topbar notebook-topbar">

          <button
            id="menu-open"
            class="menu-open"
            type="button"
            aria-label="Abrir menu"
          >
            ☰
          </button>

          <div class="page-heading">

            <span
              class="eyebrow"
              data-page-eyebrow
            ></span>

            <h1 data-page-title></h1>

          </div>

          <div class="notebook-top-actions">

            <a
              href="cronograma.html"
              class="button secondary notebook-back-button"
            >
              ← Cronograma
            </a>

            <span
              id="notebook-save-status"
              class="notebook-save-status"
            >
              Selecione uma aula
            </span>

          </div>

        </header>


        <!-- ÁREA PRINCIPAL -->
        <section class="notebook-workspace">


          <!-- LISTA DE AULAS -->
          <aside class="notebook-topic-panel">

            <div class="notebook-topic-head">

              <div>

                <span class="badge accent">
                  Caderno
                </span>

                <h2>Aulas</h2>

              </div>

              <span
                id="notebook-topic-count"
                class="notebook-topic-count"
              >
                0
              </span>

            </div>


            <label class="notebook-search">

              <span class="sr-only">
                Buscar aula
              </span>

              <input
                id="notebook-topic-search"
                type="search"
                placeholder="Buscar tema, matéria ou área..."
                autocomplete="off"
              >

            </label>


            <div
              id="notebook-topic-list"
              class="notebook-topic-list"
            >

              <div class="notebook-empty-small">
                Carregando suas aulas...
              </div>

            </div>

          </aside>


          <!-- EDITOR -->
          <section class="notebook-editor-column">


            <!-- BARRA DO EDITOR -->
            <div
              id="notebook-toolbar"
              class="notebook-toolbar"
              aria-label="Ferramentas do caderno"
            >

              <select
                id="notebook-block-style"
                class="notebook-style-select"
                aria-label="Estilo do texto"
                disabled
              >

                <option value="p">
                  Texto normal
                </option>

                <option value="h1">
                  Título 1
                </option>

                <option value="h2">
                  Título 2
                </option>

                <option value="h3">
                  Subtítulo
                </option>

              </select>


              <span class="notebook-toolbar-divider"></span>


              <button
                id="notebook-bold"
                class="notebook-tool-button"
                type="button"
                title="Negrito"
                disabled
              >
                <strong>B</strong>
              </button>


              <button
                id="notebook-italic"
                class="notebook-tool-button"
                type="button"
                title="Itálico"
                disabled
              >
                <em>I</em>
              </button>


              <button
                id="notebook-underline"
                class="notebook-tool-button"
                type="button"
                title="Sublinhado"
                disabled
              >
                <u>U</u>
              </button>


              <span class="notebook-toolbar-divider"></span>


              <button
                id="notebook-list"
                class="notebook-tool-button notebook-tool-text"
                type="button"
                title="Lista"
                disabled
              >
                • Lista
              </button>


              <button
                id="notebook-numbered-list"
                class="notebook-tool-button notebook-tool-text"
                type="button"
                title="Lista numerada"
                disabled
              >
                1. Lista
              </button>


              <span class="notebook-toolbar-divider"></span>


              <!-- EMOJIS -->
              <div class="notebook-emoji-wrap">

                <button
                  id="notebook-emoji-toggle"
                  class="notebook-tool-button"
                  type="button"
                  title="Emoji"
                  aria-expanded="false"
                  disabled
                >
                  ☺
                </button>

                <div
                  id="notebook-emoji-menu"
                  class="notebook-emoji-menu"
                  hidden
                ></div>

              </div>


              <span class="notebook-toolbar-divider"></span>


              <!-- BLOCOS DE ESTUDO -->

              <button
                class="notebook-study-tool important"
                type="button"
                data-study-block="important"
                disabled
              >
                ★ Importante
              </button>


              <button
                class="notebook-study-tool warning"
                type="button"
                data-study-block="warning"
                disabled
              >
                ⚠ Pegadinha
              </button>


              <button
                class="notebook-study-tool memory"
                type="button"
                data-study-block="memory"
                disabled
              >
                🧠 Decore
              </button>


              <span class="notebook-toolbar-spacer"></span>


              <button
                id="notebook-save-now"
                class="button secondary compact-button"
                type="button"
                disabled
              >
                Salvar
              </button>

            </div>


           

            </div>


            <!-- DOCUMENTO -->
            <div
              id="notebook-document-wrap"
              class="notebook-document-wrap"
              hidden
            >

              <article class="notebook-paper">


                <!-- CABEÇALHO DO DOCUMENTO -->
                <header class="notebook-document-head">

                  <div
                    id="notebook-document-breadcrumb"
                    class="notebook-document-breadcrumb"
                  ></div>

                  <h1
                    id="notebook-document-title"
                  >
                    Tema
                  </h1>

                  <p
                    id="notebook-document-meta"
                  ></p>

                </header>


                <!-- CAMPO DE TEXTO -->
                <div
                  id="notebook-editor"
                  class="notebook-editor"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  spellcheck="true"
                  data-placeholder="Comece a escrever seu resumo..."
                ></div>


              </article>

            </div>

          </section>

        </section>

      </div>

    </main>

  </div>


  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- IMPORTANTE: É supabase.js, NÃO config.js -->
  <script src="supabase.js"></script>

  <!-- ESTRUTURA GERAL DO RESIBULANDO -->
  <script src="app.js?v=12.1"></script>

  <!-- CADERNO -->
  <script src="caderno.js?v=14.0"></script>

</body>
</html>
