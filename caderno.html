<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno · Resibulando</title>
  <link rel="icon" type="image/png" href="favicon.png?v=resibulando2">
  <link rel="stylesheet" href="style.css?v=12.1">
  <link rel="stylesheet" href="caderno.css?v=16.0">
</head>

<body data-page="caderno">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <main class="main notebook-main-shell">
      <div class="page notebook-page">

        <header class="topbar notebook-topbar">
          <button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button>
          <div class="page-heading">
            <span class="eyebrow" data-page-eyebrow></span>
            <h1 data-page-title></h1>
          </div>
          <span id="notebook-save-status" class="notebook-save-status"></span>
        </header>

        <nav class="notebook-tabs" aria-label="Seções do caderno">
          <button class="notebook-tab active" type="button" data-notebook-tab="editor">Caderno</button>
          <button class="notebook-tab" type="button" data-notebook-tab="library">Biblioteca</button>
        </nav>

        <section id="notebook-view-editor" class="notebook-view">
          <div class="notebook-workspace">

            <aside class="notebook-topic-panel">
              <div class="notebook-topic-panel-head">
                <div>
                  <span class="badge accent">Aulas</span>
                  <h2>Temas</h2>
                </div>
                <span id="notebook-topic-count" class="notebook-topic-count">0</span>
              </div>

              <div class="notebook-searchbar notebook-topic-searchbar">
                <input
                  id="notebook-topic-search"
                  type="search"
                  placeholder="Pesquisar tema, matéria ou área..."
                  autocomplete="off"
                >
              </div>

              <div id="notebook-topic-list" class="notebook-topic-list">
                <div class="notebook-empty-small">Carregando temas...</div>
              </div>
            </aside>

            <section class="notebook-editor-column">

              <div id="notebook-toolbar" class="notebook-toolbar" aria-label="Ferramentas de edição">
                <select id="notebook-block-style" class="notebook-style-select" aria-label="Estilo do texto" disabled>
                  <option value="p">Texto normal</option>
                  <option value="h1">Título grande</option>
                  <option value="h2">Título</option>
                  <option value="h3">Subtítulo</option>
                </select>

                <span class="notebook-toolbar-divider"></span>

                <button id="notebook-bold" class="notebook-tool-button" type="button" title="Negrito" disabled><strong>B</strong></button>
                <button id="notebook-italic" class="notebook-tool-button" type="button" title="Itálico" disabled><em>I</em></button>
                <button id="notebook-underline" class="notebook-tool-button" type="button" title="Sublinhado" disabled><u>U</u></button>

                <span class="notebook-toolbar-divider"></span>

                <button id="notebook-list" class="notebook-tool-button notebook-tool-text" type="button" title="Lista" disabled>• Lista</button>
                <button id="notebook-numbered-list" class="notebook-tool-button notebook-tool-text" type="button" title="Lista numerada" disabled>1. Lista</button>

                <span class="notebook-toolbar-divider"></span>

                <button id="notebook-template" class="notebook-tool-button notebook-tool-text notebook-template-button" type="button" title="Inserir estrutura do resumo" disabled>+ Estrutura</button>
                <button id="notebook-break" class="notebook-tool-button" type="button" title="Inserir quebra de texto" disabled>↵</button>
                <button id="notebook-divider" class="notebook-tool-button notebook-tool-text" type="button" title="Inserir linha divisória" disabled>— Linha</button>

                <span class="notebook-toolbar-divider"></span>

                <div class="notebook-emoji-wrap">
                  <button id="notebook-emoji-toggle" class="notebook-tool-button" type="button" title="Inserir emoji" aria-expanded="false" disabled>☺</button>
                  <div id="notebook-emoji-menu" class="notebook-emoji-menu" hidden></div>
                </div>

                <span class="notebook-toolbar-divider"></span>

                <button class="notebook-study-tool important" type="button" data-study-block="important" disabled>★ Importante</button>
                <button class="notebook-study-tool warning" type="button" data-study-block="warning" disabled>⚠ Pegadinha</button>
                <button class="notebook-study-tool memory" type="button" data-study-block="memory" disabled>🧠 Decore</button>

                <span class="notebook-toolbar-spacer"></span>

                <button id="notebook-save-now" class="button secondary compact-button" type="button" disabled>Salvar</button>
              </div>

              <div id="notebook-editor-hint" class="notebook-editor-hint">
                Selecione um tema na lista ao lado para abrir o caderno.
              </div>

              <div id="notebook-document-wrap" class="notebook-document-wrap" hidden>
                <article class="notebook-paper">
                  <header class="notebook-document-head">
                    <h1 id="notebook-document-title">Tema</h1>
                    <div class="notebook-document-meta">
                      <span id="notebook-document-area"></span>
                      <span id="notebook-document-date"></span>
                    </div>
                  </header>

                  <div
                    id="notebook-editor"
                    class="notebook-editor"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    spellcheck="true"
                    data-placeholder="Comece a escrever seu resumo..."
                  ></div>
                </article>
              </div>

            </section>
          </div>
        </section>

        <section id="notebook-view-library" class="notebook-view" hidden>
          <div class="notebook-view-head">
            <div>
              <h2>Biblioteca</h2>
              <p>Selecione os cadernos que deseja exportar em PDF.</p>
            </div>
          </div>

          <div class="notebook-searchbar">
            <input
              id="notebook-library-search"
              type="search"
              placeholder="Pesquisar tema, área ou data..."
              autocomplete="off"
            >
          </div>

          <div class="notebook-library-actions">
            <label class="notebook-select-all">
              <input id="notebook-library-select-all" type="checkbox">
              <span>Selecionar todos</span>
            </label>

            <span id="notebook-library-selected-count" class="notebook-selected-count">0 selecionados</span>
            <span class="notebook-library-spacer"></span>

            <button id="notebook-library-export" class="button primary compact-button" type="button" disabled>Exportar PDF</button>
            <button id="notebook-library-delete" class="button secondary compact-button danger-button" type="button" disabled>Apagar</button>
          </div>

          <div id="notebook-library-list" class="notebook-library-list">
            <div class="notebook-empty-small">Carregando biblioteca...</div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js?v=12.1"></script>
  <script src="caderno.js?v=16.0"></script>
</body>
</html>
