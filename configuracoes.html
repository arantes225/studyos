<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS | Configurações</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <a class="logo" href="dashboard.html">StudyOS</a>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="cronograma.html">Cronograma</a>
    <a href="caderno-erros.html">Caderno de erros</a>
    <a href="editais.html">Editais</a>
    <a href="configuracoes.html">Configurações</a>
  </nav>
  <button class="btn small secondary" data-logout>Sair</button>
</header>

<main class="page">
  <section class="page-header">
    <div>
      <p class="eyebrow">Preferências</p>
      <h1>Configurações</h1>
      <p class="muted">Defina os intervalos de revisão em dias.</p>
    </div>
  </section>

  <section class="card narrow">
    <div class="field">
      <label for="cfg-flashcard">Flashcards</label>
      <input id="cfg-flashcard" placeholder="1,3,7,15,30">
      <small class="muted">Ex.: 1,3,7,15,30</small>
    </div>

    <div class="field">
      <label for="cfg-erros">Caderno de erros</label>
      <input id="cfg-erros" placeholder="3,7,15,30">
    </div>

    <div class="field">
      <label for="cfg-materia">Revisão de matéria</label>
      <input id="cfg-materia" placeholder="7,14,30">
    </div>

    <button id="cfg-salvar" class="btn primary">Salvar configurações</button>
    <p id="cfg-msg" class="message"></p>
  </section>
</main>
<script src="supabase.js"></script>
<script src="configuracoes.js"></script>
</body>
</html>
