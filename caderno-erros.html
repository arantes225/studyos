<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS | Caderno de erros</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <a class="logo" href="dashboard.html">StudyOS</a>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="cronograma.html">Cronograma</a>
    <a href="caderno-erros.html">Caderno de erros</a>
    <a href="editais.html">Editais</a>
    <a href="configuracoes.html">Configurações</a>
  </nav>
  <button class="btn small secondary" data-logout>Sair</button>
</header>

<main class="page">
  <section class="page-header">
    <div>
      <p class="eyebrow">Aprendizado ativo</p>
      <h1>Caderno de erros</h1>
      <p class="muted">Registre questões erradas e revise depois.</p>
    </div>
  </section>

  <section class="two-columns">
    <div class="card">
      <h2>Novo erro</h2>

      <div class="field">
        <label for="ce-materia">Matéria</label>
        <input id="ce-materia" placeholder="Ex.: Pediatria">
      </div>

      <div class="field">
        <label for="ce-tema">Tema</label>
        <input id="ce-tema" placeholder="Ex.: Asma">
      </div>

      <div class="field">
        <label for="ce-pergunta">Questão / erro</label>
        <textarea id="ce-pergunta" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="ce-resposta">Resposta correta</label>
        <textarea id="ce-resposta" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="ce-comentario">Comentário</label>
        <textarea id="ce-comentario" rows="4"></textarea>
      </div>

      <button id="ce-salvar" class="btn primary">Salvar</button>
      <p id="ce-msg" class="message"></p>
    </div>

    <div class="card">
      <h2>Itens</h2>
      <div id="ce-lista" class="list"></div>
    </div>
  </section>
</main>
<script src="supabase.js"></script>
<script src="caderno-erros.js"></script>
</body>
</html>
