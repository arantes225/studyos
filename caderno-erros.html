<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno de erros · DocMap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="erros">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <main class="main">
      <div class="page">
        <header class="topbar">
          <button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button>
          <div class="page-heading">
            <span class="eyebrow" data-page-eyebrow></span>
            <h1 data-page-title></h1>
          </div>
        </header>

        
<section class="feature-grid">
  <article class="feature-card">
    <span class="badge">CCQ</span>
    <h2>Ideia central</h2>
    <p>O conceito que você quer lembrar será a peça central de cada erro.</p>
  </article>

  <article class="feature-card">
    <span class="badge">Revisão</span>
    <h2>A cada 21 dias</h2>
    <p>A periodicidade poderá ser alterada em Configurações.</p>
  </article>
</section>

<section class="panel">
  <div class="panel-header">
    <div>
      <h2>Caderno de erros</h2>
      <p>Questão, imagem/OCR, resposta correta e “o que pensei”.</p>
    </div>
    <span class="badge accent">Fase 7</span>
  </div>

  <div class="placeholder">O formulário e as revisões entram na Fase 7.</div>
</section>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
