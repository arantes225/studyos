<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teste Login DocMap</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>Teste de Login</h1>

  <input
    id="email"
    type="email"
    placeholder="E-mail"
  >

  <br><br>

  <input
    id="senha"
    type="password"
    placeholder="Senha"
  >

  <br><br>

  <button id="entrar">
    Entrar
  </button>

  <button id="criar">
    Criar conta
  </button>

  <p id="mensagem"></p>


<script>

const SUPABASE_URL =
  "https://sxdsfklllilhdyuamvvg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AQ5-Pn1knmBhSFyt5aMtjQ_XQynLJ_L";


const cliente =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const mensagem =
  document.getElementById("mensagem");


console.log("Página carregada");

console.log(
  "Supabase:",
  cliente
);


/* LOGIN */

document
  .getElementById("entrar")
  .addEventListener(
    "click",
    async function () {

      console.log(
        "Clicou em entrar"
      );


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const senha =
        document
          .getElementById("senha")
          .value;


      mensagem.textContent =
        "Tentando entrar...";


      const {
        data,
        error
      } =
        await cliente.auth
          .signInWithPassword({

            email: email,

            password: senha

          });


      console.log(
        "LOGIN DATA:",
        data
      );


      console.log(
        "LOGIN ERROR:",
        error
      );


      if (error) {

        mensagem.style.color =
          "red";


        mensagem.textContent =
          error.message;

        return;

      }


      mensagem.style.color =
        "green";


      mensagem.textContent =
        "LOGIN FUNCIONOU!";

    }
  );


/* CRIAR CONTA */

document
  .getElementById("criar")
  .addEventListener(
    "click",
    async function () {

      console.log(
        "Clicou em criar conta"
      );


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const senha =
        document
          .getElementById("senha")
          .value;


      mensagem.textContent =
        "Criando conta...";


      const {
        data,
        error
      } =
        await cliente.auth
          .signUp({

            email: email,

            password: senha

          });


      console.log(
        "SIGNUP DATA:",
        data
      );


      console.log(
        "SIGNUP ERROR:",
        error
      );


      if (error) {

        mensagem.style.color =
          "red";


        mensagem.textContent =
          error.message;

        return;

      }


      mensagem.style.color =
        "green";


      mensagem.textContent =
        "CONTA CRIADA!";

    }
  );

</script>

</body>
</html>
