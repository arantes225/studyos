<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS | Editais</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <a class="logo" href="dashboard.html">StudyOS</a>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="cronograma.html">Cronograma</a>
    <a href="caderno-erros.html">Caderno de erros</a>
    <a href="editais.html">Editais</a>
    <a href="configuracoes.html">Configurações</a>
  </nav>
  <button class="btn small secondary" data-logout>Sair</button>
</header>

<main class="page">
  <section class="page-header">
    <div>
      <p class="eyebrow">Provas</p>
      <h1>Editais</h1>
      <p class="muted">Cadastre provas e temas específicos.</p>
    </div>
  </section>

  <section class="two-columns">
    <div class="card">
      <h2>Novo edital</h2>

      <div class="field">
        <label for="ed-nome">Nome</label>
        <input id="ed-nome" placeholder="Ex.: ENARE 2027">
      </div>

      <div class="field">
        <label for="ed-instituicao">Instituição</label>
        <input id="ed-instituicao" placeholder="Opcional">
      </div>

      <div class="field">
        <label for="ed-data">Data da prova</label>
        <input id="ed-data" type="date">
      </div>

      <button id="ed-salvar" class="btn primary">Salvar edital</button>
      <p id="ed-msg" class="message"></p>
    </div>

    <div class="card">
      <h2>Seus editais</h2>
      <div id="ed-lista" class="list"></div>
    </div>
  </section>
</main>
<script src="supabase.js"></script>
<script src="editais.js"></script>
</body>
</html>
