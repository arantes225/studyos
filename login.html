<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DocMap | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;

      background: #f5f6f8;
      color: #111827;
    }

    .login {
      width: 90%;
      max-width: 420px;

      padding: 35px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;

      margin-top: 18px;
      margin-bottom: 6px;

      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 13px;

      border:
        1px solid #d1d5db;

      border-radius: 8px;

      font-size: 16px;
    }

    button {
      width: 100%;

      margin-top: 16px;
      padding: 13px;

      border: none;
      border-radius: 8px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    #entrar {
      background: #111827;
      color: white;
    }

    #criar-conta {
      background: #e5e7eb;
      color: #111827;
    }

    #mensagem {
      min-height: 22px;

      margin-top: 18px;

      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="login">

    <h1>DocMap</h1>

    <p>
      Entre para continuar seus estudos.
    </p>


    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      type="email"
      placeholder="seu@email.com"
    >


    <label for="senha">
      Senha
    </label>

    <input
      id="senha"
      type="password"
      placeholder="Sua senha"
    >


    <button
      id="entrar"
      type="button"
    >
      Entrar
    </button>


    <button
      id="criar-conta"
      type="button"
    >
      Criar conta
    </button>


    <p id="mensagem"></p>

  </main>


  <script src="auth.js"></script>

</body>

</html>
