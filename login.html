<body class="auth-page">

  <main class="auth-card">

    <div class="auth-brand">

      <img
        class="auth-brand-logo"
        src="assets/img/logos/logo-icone-original.png?v=luria9"
        alt="Logo LURIA"
      >

      <div class="auth-brand-copy">
        <h1>LURIA</h1>
        <p>Aprenda. Conecte. Consolide.</p>
      </div>

    </div>

    <form
      id="login-form"
      class="auth-form"
    >

      <label>
        E-mail

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="voce@email.com"
          required
        >
      </label>

      <label>
        Senha

        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          required
        >
      </label>

      <label class="auth-remember">
        <input
          id="lembrar"
          type="checkbox"
          checked
        >
        <span>Lembrar de mim neste navegador</span>
      </label>

      <button
        id="entrar"
        class="button primary"
        type="submit"
      >
        Entrar
      </button>

      <button
        id="passkey-login"
        class="button secondary"
        type="button"
        hidden
      >
        Entrar com Face ID / Passkey
      </button>

      <button
        id="criar-conta"
        class="button secondary"
        type="button"
      >
        Criar conta
      </button>

      <p
        id="mensagem"
        class="auth-message"
        aria-live="polite"
      ></p>

    </form>

  </main>
