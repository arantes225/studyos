<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>StudyOS | Login</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
</head>

<body>

  <main class="container login-container">

    <h1>StudyOS</h1>

    <p class="subtitulo">
      Entre para continuar seus estudos.
    </p>


    <div
      id="usuario-logado"
      class="usuario-logado"
      style="display:none;"
    >

      <p>
        Você está conectado como:
      </p>

      <strong id="email-logado"></strong>

      <button
        id="botao-sair"
        class="botao botao-secundario"
      >
        Sair
      </button>

    </div>


    <div id="form-autenticacao">

      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        autocomplete="email"
      >


      <label for="senha">
        Senha
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
      >


      <button
        id="botao-entrar"
        class="botao"
      >
        Entrar
      </button>


      <button
        id="botao-criar-conta"
        class="botao botao-secundario"
      >
        Criar conta
      </button>


      <div
        id="mensagem-auth"
        class="mensagem"
      ></div>

    </div>

  </main>


  <script src="supabase.js"></script>
  <script src="auth.js"></script>

</body>

</html>
