<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS — Login</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span>StudyOS</span>
      </div>

      <h1>Organize seus estudos.</h1>
      <p class="subtitle">Entre na sua conta ou crie uma nova.</p>

      <div class="form-section">
        <h2>Entrar</h2>

        <label for="login-email">E-mail</label>
        <input
          id="login-email"
          type="email"
          placeholder="voce@email.com"
        >

        <label for="login-password">Senha</label>
        <input
          id="login-password"
          type="password"
          placeholder="Sua senha"
        >

        <button id="login-btn" class="primary-btn">
          Entrar
        </button>

        <p id="login-msg" class="message"></p>
      </div>

      <div class="divider">
        <span>ou</span>
      </div>

      <div class="form-section">
        <h2>Criar conta</h2>

        <label for="signup-email">E-mail</label>
        <input
          id="signup-email"
          type="email"
          placeholder="voce@email.com"
        >

        <label for="signup-password">Senha</label>
        <input
          id="signup-password"
          type="password"
          placeholder="Mínimo de 6 caracteres"
        >

        <button id="signup-btn" class="secondary-btn">
          Criar conta
        </button>

        <p id="signup-msg" class="message"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
