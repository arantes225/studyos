<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DocMap | Login</title>

  <link rel="stylesheet" href="style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
</head>

<body>

  <main class="container">

    <h1>DocMap</h1>

    <p>Entre na sua conta</p>


    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      type="email"
      placeholder="seu@email.com"
    >


    <label for="senha">
      Senha
    </label>

    <input
      id="senha"
      type="password"
      placeholder="Sua senha"
    >


    <button
      id="entrar"
      type="button"
    >
      Entrar
    </button>


    <button
      id="criar-conta"
      type="button"
    >
      Criar conta
    </button>


    <p id="mensagem"></p>

  </main>


  <!-- ORDEM IMPORTANTE -->
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

</body>

</html>
