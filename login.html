<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyOS | Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">S</div>
    <h1>StudyOS</h1>
    <p class="muted">Entre para continuar seus estudos.</p>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="voce@email.com">
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
    </div>

    <button id="botao-entrar" class="btn primary">Entrar</button>
    <button id="botao-criar-conta" class="btn secondary">Criar conta</button>

    <p id="mensagem-auth" class="message"></p>
  </main>

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
